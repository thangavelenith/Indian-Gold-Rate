name: Update Daily Fixed Gold Rate

on:
  schedule:
    # Runs Monday to Saturday every 2 hours from 10:07 AM to 6:07 PM IST (04:37–12:37 UTC)
    - cron: '37 4,6,8,10,12 * * 1-6'
  # Allows manual one-click testing or external cron-job.org triggers
  workflow_dispatch:

jobs:
  update-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch daily retail rate and publish to Firebase RTDB
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: 'https://indian-gold-rate-default-rtdb.asia-southeast1.firebasedatabase.app'
        run: node scripts/update-daily-rate.mjs
