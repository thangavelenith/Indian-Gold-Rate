name: Update Daily Fixed Gold Rate

on:
  schedule:
    # Runs every 2 hours (24/7, all dates & days) at off-peak minute :37 UTC (:07 IST)
    - cron: '37 */2 * * *'
  # Allows manual one-click testing or external cron-job.org triggers
  workflow_dispatch:

jobs:
  update-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch daily retail rate and publish to Firebase RTDB
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: 'https://indian-gold-rate-default-rtdb.asia-southeast1.firebasedatabase.app'
        run: node scripts/update-daily-rate.mjs
