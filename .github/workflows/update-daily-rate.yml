name: Update Daily Fixed Gold Rate

on:
  schedule:
    # Runs Monday to Saturday at 10:00 AM IST (04:30 UTC) and 4:00 PM IST (10:30 UTC)
    - cron: '30 4 * * 1-6'
    - cron: '30 10 * * 1-6'
  # Allows manual one-click testing from the GitHub Actions tab
  workflow_dispatch:

jobs:
  update-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch daily retail rate and publish to Firebase RTDB
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: 'https://indian-gold-rate-default-rtdb.asia-southeast1.firebasedatabase.app'
        run: node scripts/update-daily-rate.mjs
        
